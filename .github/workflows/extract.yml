name: Extract code.zip
on:
  push:
    paths:
      - 'code.zip'
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unzip code.zip
        run: |
          unzip -o code.zip -x '.github/*'
          rm code.zip
      - name: Commit extracted files
        run: |
          git config user.name "Muse"
          git config user.email "muse@theoven.local"
          git add -A
          git commit -m "Add generated food assets and wiring" || echo "nothing to commit"
          git push
